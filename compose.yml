services:

  webhook:
    build:
      context: .
      target: webhook
      args:
        AWS_ENABLED: "true"
    command: ["-hooks=/opt/webhook/hooks.json", "-verbose"]
    networks:
      - default
    volumes:
      - ./examples/hooks.json:/opt/webhook/hooks.json
      - ./examples/webhook.sh:/opt/webhook/scripts/webhook.sh
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9000/" ]
      interval: 5s
      timeout: 10s
      start_period: 10s
    restart: on-failure

networks:
  default:
    internal: true
